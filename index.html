<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coral Novo Cântico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-4">

  <!-- Header com Busca -->
  <header class="max-w-md mx-auto mb-6">
    <h1 class="text-2xl font-bold text-center mb-4 titulo">Acervo Coral Novo Cântico</h1>
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" placeholder="Buscar uma música..." class="w-full py-3 pr-3 pl-11 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-indigo-500">
    </div>
  </header>

  <main class="max-w-md mx-auto">
    <!-- Lista de Músicas com Sanfona embutida -->
    <div id="songList" class="space-y-3 mb-6"></div>
  </main>

  <script src="script.js"></script>
</body>

</html>
